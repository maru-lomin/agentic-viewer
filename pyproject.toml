[project]
name = "agentic-viewer"
version = "0.2.0"
description = "UI for inspecting agentic KV extraction run traces (outputs/runs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agentic-viewer = "agentic_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_viewer"]
